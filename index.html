
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Registro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2, #6c5ce7);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

.contenedor {
    width: 100%;
    max-width: 480px;
}

.encabezado {
    text-align: center;
    color: white;
    margin-bottom: 25px;
}

.encabezado h1 {
    font-size: 30px;
    margin-bottom: 8px;
    font-weight: 700;
}

.encabezado p {
    font-size: 14px;
    color: #eeeaff;
}

form {
    background: #ffffff;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.22);
}

h2 {
    text-align: center;
    color: #34345a;
    font-size: 23px;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: 600;
    color: #454563;
    margin-top: 18px;
    margin-bottom: 8px;
    font-size: 14px;
}

input, textarea {
    width: 100%;
    padding: 14px 15px;
    border: 1.5px solid #e0e0ed;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fafaff;
    color: #333;
    outline: none;
    transition: all 0.3s ease;
}

input:focus, textarea:focus {
    border-color: #7655e8;
    background: white;
    box-shadow: 0 0 0 4px rgba(118,85,232,0.12);
}

input::placeholder, textarea::placeholder {
    color: #aaaabd;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

form p {
    font-size: 12px;
    margin-top: 6px;
    min-height: 15px;
    font-weight: 500;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 22px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(102,126,234,0.3);
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(102,126,234,0.4);
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

#resultado {
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    margin-top: 15px;
    min-height: 18px;
}

.pie {
    text-align: center;
    color: #eeeaff;
    font-size: 12px;
    margin-top: 20px;
}

@media (max-width: 500px) {
    form {
        padding: 25px 20px;
    }

    .encabezado h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="contenedor">

    <div class="encabezado">
        <h1>✦ Bienvenido</h1>
        <p>Completa tus datos para registrarte</p>
    </div>

    <form id="formulario">

        <h2>Formulario de Registro</h2>

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
        <p id="errorNombre" style="color:red"></p>

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" placeholder="Ingresa tu apellido" required>
        <p id="errorApellido" style="color:red"></p>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
        <p id="errorCorreo" style="color:red"></p>

        <label for="comentarios">Comentarios</label>
        <textarea id="comentarios"
        placeholder="Escribe tus comentarios aquí..."
        required></textarea>
        <p id="errorComentarios" style="color:red"></p>

        <button type="submit" id="btnEnviar">
            Enviar formulario →
        </button>

        <p id="resultado"></p>

    </form>

    <div class="pie">
        © 2026 - Formulario de Registro
    </div>

</div>

<script>

// PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
const URL_GOOGLE_SHEETS = "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT";

// VALIDAR NOMBRE
function validarNombre() {

    let nombre = document.getElementById("nombre").value.trim();
    let error = document.getElementById("errorNombre");

    if (nombre === "") {
        error.textContent = "El nombre es obligatorio.";
        return false;
    }

    if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]+$/.test(nombre)) {
        error.textContent = "Incorrecto: solo debes escribir letras.";
        return false;
    }

    error.textContent = "";
    return true;
}

// VALIDAR APELLIDO
function validarApellido() {

    let apellido = document.getElementById("apellido").value.trim();
    let error = document.getElementById("errorApellido");

    if (apellido === "") {
        error.textContent = "El apellido es obligatorio.";
        return false;
    }

    if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]+$/.test(apellido)) {
        error.textContent = "Incorrecto: solo debes escribir letras.";
        return false;
    }

    error.textContent = "";
    return true;
}

// VALIDAR CORREO
function validarCorreo() {

    let correo = document.getElementById("correo").value.trim();
    let error = document.getElementById("errorCorreo");

    if (correo === "") {
        error.textContent = "El correo es obligatorio.";
        error.style.color = "red";
        return false;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
        error.textContent = "Incorrecto: correo electrónico no válido.";
        error.style.color = "red";
        return false;
    }

    error.textContent = "Correo correcto.";
    error.style.color = "green";

    return true;
}

// VALIDAR COMENTARIOS
function validarComentarios() {

    let comentarios = document.getElementById("comentarios").value.trim();

    let palabras = comentarios.split(/\s+/).filter(Boolean);

    let error = document.getElementById("errorComentarios");

    if (palabras.length < 11) {

        error.textContent =
        "Incorrecto: mínimo 11 palabras. Llevas " + palabras.length + ".";

        error.style.color = "red";

        return false;

    } else {

        error.textContent =
        "Correcto: tienes " + palabras.length + " palabras.";

        error.style.color = "green";

        return true;
    }
}

// VALIDAR MIENTRAS ESCRIBES
document.getElementById("nombre").addEventListener("input", validarNombre);

document.getElementById("apellido").addEventListener("input", validarApellido);

document.getElementById("correo").addEventListener("input", validarCorreo);

document.getElementById("comentarios").addEventListener("input", validarComentarios);

// ENVIAR FORMULARIO A GOOGLE SHEETS
document.getElementById("formulario").addEventListener("submit", async function(e) {

    e.preventDefault();

    let nombreValido = validarNombre();
    let apellidoValido = validarApellido();
    let correoValido = validarCorreo();
    let comentariosValidos = validarComentarios();

    let resultado = document.getElementById("resultado");
    let boton = document.getElementById("btnEnviar");

    if (!nombreValido || !apellidoValido ||
        !correoValido || !comentariosValidos) {

        resultado.textContent = "Corrige los errores para continuar.";
        resultado.style.color = "red";

        return;
    }

    if (URL_GOOGLE_SHEETS === "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT") {

        resultado.textContent = "Primero configura la URL de Google Sheets.";
        resultado.style.color = "red";

        return;
    }

    boton.disabled = true;
    boton.textContent = "Enviando...";

    resultado.textContent = "Enviando tus datos...";
    resultado.style.color = "blue";

    const datos = new URLSearchParams();

    datos.append("nombre", document.getElementById("nombre").value.trim());
    datos.append("apellido", document.getElementById("apellido").value.trim());
    datos.append("correo", document.getElementById("correo").value.trim());
    datos.append("comentarios", document.getElementById("comentarios").value.trim());

    try {

        await fetch(URL_GOOGLE_SHEETS, {
            method: "POST",
            mode: "no-cors",
            body: datos
        });

        resultado.textContent =
        "¡Solicitud enviada! Revisa tu Google Sheets.";

        resultado.style.color = "green";

        document.getElementById("formulario").reset();

        document.getElementById("errorNombre").textContent = "";
        document.getElementById("errorApellido").textContent = "";
        document.getElementById("errorCorreo").textContent = "";
        document.getElementById("errorComentarios").textContent = "";

    } catch (error) {

        resultado.textContent =
        "Error al enviar los datos. Intenta nuevamente.";

        resultado.style.color = "red";

    } finally {

        boton.disabled = false;
        boton.textContent = "Enviar formulario →";

    }

});

</script>

</body>
</html>
